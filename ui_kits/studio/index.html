<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mehmet Ergul — Studio (Multi-domain UI Kit)</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 36px 28px 80px; }
  .tabs-row { margin-bottom: 36px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="studio.jsx"></script>
<script type="text/babel">
  const { Tabs } = window.MehmetErgulDesignSystem_61b8ed;
  function App() {
    const [tab, setTab] = React.useState("videos");
    const [reading, setReading] = React.useState(null);

    return (
      <div data-theme="ink">
        <StudioBar />
        <StudioHero />
        <div className="wrap">
          <div className="tabs-row">
            <Tabs value={tab} onChange={(t) => { setTab(t); setReading(null); }} items={[
              { id: "videos", label: "Videos", count: 24 },
              { id: "writing", label: "Writing", count: 12 },
              { id: "design", label: "Design", count: 8 },
            ]} />
          </div>
          {tab === "videos" && <VideosStream />}
          {tab === "writing" && (reading
            ? <ReadingPanel post={reading} onClose={() => setReading(null)} />
            : <WritingStream onRead={setReading} />)}
          {tab === "design" && <DesignStream />}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
