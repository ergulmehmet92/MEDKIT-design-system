<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mehmet Ergul — Portfolio UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; }
  #root { position: relative; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
  function App() {
    const [route, setRoute] = React.useState("home");   // home | thoughts | about | article
    const [article, setArticle] = React.useState(null);

    const top = React.useRef(null);
    const go = (r) => { setRoute(r); if (top.current) top.current.scrollTop = 0; };
    const openThought = (post) => { setArticle(post); setRoute("article"); if (top.current) top.current.scrollTop = 0; };

    const light = false; // article reader keeps a dark background → dark header chrome
    return (
      <div ref={top} style={{ position: "relative", minHeight: "100vh", overflowX: "hidden" }}>
        <SiteHeader route={route === "article" ? "thoughts" : route} onNavigate={go} light={light} />
        {route === "home" && <HomeScreen onOpenWork={() => {}} onOpenThought={openThought} />}
        {route === "thoughts" && <ThoughtsScreen onOpenThought={openThought} />}
        {route === "about" && <AboutScreen />}
        {route === "article" && <ArticleScreen post={article} onBack={() => go("thoughts")} />}
        <SiteFooter />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
