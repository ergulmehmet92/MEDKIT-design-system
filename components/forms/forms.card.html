<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-sans); color: var(--color-fg-muted); padding: 26px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: end; }
  label { font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
  .inline { flex-direction: row; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select } = window.MehmetErgulDesignSystem_61b8ed;
  function Demo() {
    const [email, setEmail] = React.useState("");
    const [sort, setSort] = React.useState("latest");
    return (
      <div className="grid">
        <label>Email<Input ariaLabel="Email" type="email" placeholder="you@studio.com" value={email} onChange={(e) => setEmail(e.target.value)} /></label>
        <label className="inline">Sort by
          <Select ariaLabel="Sort" value={sort} onChange={(e) => setSort(e.target.value)}
            options={[{ value: "latest", label: "Latest to oldest" }, { value: "reading-time", label: "Reading time" }]} /></label>
        <label style={{ gridColumn: "1 / -1" }}>Message<Input multiline rows={3} placeholder="Tell me about the project…" /></label>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
