<!-- @dsCard group="Type" viewport="700x230" name="Display & headings" subtitle="Light-weight display, tight tracking — the quiet brand voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-sans); color: var(--color-fg); padding: 26px; }
  .stack > * { margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .meta { color: var(--color-fg-subtle); font-size: 11px; font-family: var(--font-mono); }
  .h1 { font-size: var(--text-6xl); font-weight: var(--weight-light); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); }
  .h2 { font-size: var(--text-4xl); font-weight: var(--weight-light); letter-spacing: var(--tracking-tight); }
  .art { font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); }
</style>
</head>
<body>
  <div class="stack">
    <div><div class="h1">Hi, I am Mehmet</div><span class="meta">60px · weight 300 · -0.03em</span></div>
    <div><div class="h2">Recent work</div><span class="meta">36px · weight 300</span></div>
    <div><div class="art">Approaching Design Systems</div><span class="meta">Editorial H1/H2 · weight 700 · -0.03em</span></div>
  </div>
</body>
</html>
