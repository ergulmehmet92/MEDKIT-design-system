<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Signature ease-out-expo; entrances fade + rise, hovers shift colour" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-sans); padding: 24px; color: var(--color-fg-muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; font-size: 12px; }
  .k { color: var(--color-fg); }
  .v { font-family: var(--font-mono); color: var(--color-fg-subtle); font-size: 11px; }
  .track { grid-column: 1 / -1; height: 6px; background: var(--color-bg-elevated); border-radius: var(--radius-pill); position: relative; overflow: hidden; margin-top: 6px; }
  .dot { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-accent); animation: slide 2.4s var(--ease-out-expo) infinite; }
  @keyframes slide { 0%,12% { left: 0 } 60%,100% { left: calc(100% - 16px) } }
</style>
</head>
<body>
  <div class="grid">
    <div class="k">ease-out-expo</div><div class="v">cubic-bezier(0.16, 1, 0.3, 1)</div>
    <div class="k">fast / medium / slow</div><div class="v">0.3s · 0.5s · 0.8s</div>
    <div class="track"><div class="dot"></div></div>
  </div>
</body>
</html>
