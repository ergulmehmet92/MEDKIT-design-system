<!-- @dsCard group="Spacing" viewport="700x200" name="Radii" subtitle="Small on media, pill on chips/CTAs, roomy on cards" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-sans); padding: 24px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 64px; background: var(--color-bg-elevated); border: 1px solid var(--color-border); }
  .lab { color: var(--color-fg-muted); font-size: 11px; }
  .v { color: var(--color-fg-subtle); font-size: 10px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lab">xs</div><div class="v">2px media</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm</div><div class="v">8px control</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md</div><div class="v">12px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg</div><div class="v">16px card</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl</div><div class="v">18px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-pill);width:64px"></div><div class="lab">pill</div><div class="v">chip · cta</div></div>
  </div>
</body>
</html>
