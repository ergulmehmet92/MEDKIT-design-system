<!-- @dsCard group="Colors" viewport="700x230" name="Dual theme — ink / paper" subtitle="Same components, two tones: dark surfaces vs warm light reading" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #000; font-family: var(--font-sans); padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--color-border); background: var(--color-bg); padding: 20px; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--color-fg-subtle); }
  .title { margin: 8px 0 14px; font-size: 24px; font-weight: 300; letter-spacing: -0.02em; color: var(--color-fg); }
  .card { border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-bg-elevated); padding: 14px; }
  .ct { font-size: 14px; color: var(--color-fg); margin: 0 0 4px; }
  .cs { font-size: 12px; color: var(--color-fg-muted); margin: 0; }
  .pill { display: inline-block; margin-top: 12px; border-radius: var(--radius-pill); padding: 6px 14px; font-size: 12px; font-weight: 600; background: var(--surface-contrast); color: var(--on-contrast); }
</style>
</head>
<body>
  <div class="pane" data-theme="ink">
    <div class="tag">data-theme=ink</div>
    <div class="title">Quiet, cinematic</div>
    <div class="card"><p class="ct">Enriching Data with AI</p><p class="cs">AI tool for enriching free-text data.</p></div>
    <span class="pill">Primary action</span>
  </div>
  <div class="pane" data-theme="paper">
    <div class="tag">data-theme=paper</div>
    <div class="title">Warm, editorial</div>
    <div class="card"><p class="ct">Approaching Design Systems</p><p class="cs">A reading-first light surface for the blog.</p></div>
    <span class="pill">Primary action</span>
  </div>
</body>
</html>
