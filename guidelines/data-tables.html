<!-- @dsCard group="Components" viewport="700x230" name="Data tables" subtitle="Hairline header rule, 60% row rules, tabular mono numerics right-aligned" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-sans); color: var(--color-fg); padding: 26px; }
  table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); text-align: left; }
  thead tr { border-bottom: 1px solid var(--color-border); }
  th { padding: 0 16px 10px 0; font-weight: var(--weight-regular); font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: var(--tracking-wider); color: var(--color-fg-subtle); }
  tbody tr { border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent); }
  td { padding: 12px 16px 12px 0; color: var(--color-fg); }
  .num { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-fg-muted); font-variant-numeric: tabular-nums; text-align: right; }
  th.num { text-align: right; }
  .status { font-size: var(--text-xs); color: var(--color-fg-muted); text-align: right; }
</style>
</head>
<body>
  <table>
    <thead>
      <tr><th>Call</th><th class="num">Entry → now</th><th class="num">Resolve by</th><th class="num">Status</th></tr>
    </thead>
    <tbody>
      <tr><td>China pivots energy imports to US supply</td><td class="num">75% → 75%</td><td class="num">2027-12-31</td><td class="status">active</td></tr>
      <tr><td>Grand Bargain — full multi-domain execution</td><td class="num">80% → 30%</td><td class="num">2028-12-31</td><td class="status">active</td></tr>
      <tr><td>Hormuz — structural stabilization</td><td class="num">85% → 65%</td><td class="num">2030-12-31</td><td class="status">active</td></tr>
    </tbody>
  </table>
</body>
</html>
