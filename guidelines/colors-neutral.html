<!-- @dsCard group="Colors" viewport="700x190" name="Neutral scale" subtitle="Near-black canvas → off-white ink; greys do the structural work" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 96px; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); }
  .name { color: var(--color-fg); font-size: 12px; margin-top: 8px; letter-spacing: 0.01em; }
  .hex { color: var(--color-fg-subtle); font-size: 11px; font-family: var(--font-mono); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-950)"></div><div class="name">ink-950</div><div class="hex">#0a0a0a</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink-900</div><div class="hex">#0e0e0e</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-850)"></div><div class="name">ink-850</div><div class="hex">#121212</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="name">ink-800</div><div class="hex">#1a1a1a</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">ink-700</div><div class="hex">#2a2a2a</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="name">ink-600</div><div class="hex">#444444</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="name">ink-500</div><div class="hex">#666666</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="name">ink-400</div><div class="hex">#999999</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="name">ink-200</div><div class="hex">#e8e8e8</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="name">ink-100</div><div class="hex">#f5f5f5</div></div>
  </div>
</body>
</html>
